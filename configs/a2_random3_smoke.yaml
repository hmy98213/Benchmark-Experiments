# A2 in-container random3 smoke-test configuration.
#
# This file is intentionally small: it only runs 3 random prompts and is meant
# to verify that model loading, speculative methods, hybrid methods, and
# cold/warm suffix passes can start successfully inside the current container.

models:
  - qwen35_27b_w8a8_mtp
  - qwen36_35b_a3b
  - qwen3_next_80b_a3b_instruct

datasets:
  - random3

methods:
  # A2-supported smoke set. DFlash is intentionally omitted because the current
  # vLLM Ascend stack does not support method=dflash. Model entries can
  # override this list below when they do not support native MTP.
  - baseline
  - ngram
  - suffix
  - mtp
  - mtp_ngram_concat
  - mtp_suffix_concat

TP: 8
DP: 1
NPU_DEVICES: "0,1,2,3,4,5,6,7"

OUTPUT_DIR: results/a2_random3_smoke
PORT_BASE: 19000
READY_TIMEOUT_S: 3600
SERVER_CLEANUP_TIMEOUT_S: 30
POST_SERVER_CLEANUP_SLEEP_S: 20
STOP_ON_FAILURE: false
SKIP_COMPLETED: false
ASCEND_DEVICE_CHECK: warn

ENV:
  TASK_QUEUE_ENABLE: "1"
  HCCL_OP_EXPANSION_MODE: AIV
  VLLM_ASCEND_ENABLE_FLASHCOMM1: "0"

COMMON_SERVER_ARGS:
  trust_remote_code: true
  distributed_executor_backend: mp
  max_model_len: 4096
  max_num_batched_tokens: 32768
  gpu_memory_utilization: 0.9
  disable_uvicorn_access_log: true
  enforce_eager: true

COMMON_BENCH_ARGS:
  request_rate: inf
  max_concurrency: 1
  temperature: 0
  ignore_eos: true

model_catalog:
  qwen35_27b_w8a8_mtp:
    path: /models/Qwen3.5-27B-w8a8-mtp
    served_model_name: qwen3.5-27b-w8a8-mtp
    tp: 8
    dp: 1
    npu_devices: "0,1,2,3,4,5,6,7"

  qwen36_35b_a3b:
    path: /models/Qwen3.6-35B-A3B
    served_model_name: qwen3.6-35b-a3b
    tp: 8
    dp: 1
    npu_devices: "0,1,2,3,4,5,6,7"
    # No native MTP marker in the model name; run model-free methods first.
    methods:
      - baseline
      - ngram
      - suffix

  qwen3_next_80b_a3b_instruct:
    path: /models/Qwen3-Next-80B-A3B-Instruct
    served_model_name: qwen3-next-80b-a3b-instruct
    tp: 8
    dp: 1
    npu_devices: "0,1,2,3,4,5,6,7"
    # Start with model-free methods; add MTP methods only after confirming this
    # checkpoint exposes the MTP heads expected by the installed vLLM Ascend.
    methods:
      - baseline
      - ngram
      - suffix

method_catalog:
  baseline: null

  mtp:
    method: mtp
    num_speculative_tokens: 4

  ngram:
    method: ngram
    num_speculative_tokens: 4
    prompt_lookup_min: 2
    prompt_lookup_max: 5

  suffix:
    method: suffix
    num_speculative_tokens: 4
    bench_passes:
      - cold
      - warm

  mtp_ngram_concat:
    method: mtp_ngram_concat
    num_speculative_tokens: 4
    hybrid_mtp_tokens: 1
    prompt_lookup_min: 2
    prompt_lookup_max: 5

  mtp_suffix_concat:
    method: mtp_suffix_concat
    num_speculative_tokens: 4
    hybrid_mtp_tokens: 1
    bench_passes:
      - cold
      - warm

dataset_catalog:
  random3:
    dataset_name: random
    num_prompts: 3
    random_input_len: 256
    random_output_len: 32
    random_range_ratio: 0.1

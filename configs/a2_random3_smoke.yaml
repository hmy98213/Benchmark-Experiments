# A2 in-container random3 smoke-test configuration.
#
# This file is intentionally small: it only runs 3 random prompts and is meant
# to verify that model loading, speculative methods, hybrid methods, and
# cold/warm suffix passes can start successfully inside the current container.

models:
  - glm_47_w8a8_floatmtp
  - qwen35_397b_a17b_w4a8_mtp
  # DeepSeek V3.2 hit NPU OOM during MoE weight allocation on A2 TP8.
  # Use the much smaller V3.1 QuaRot build for DeepSeek model-free smoke.
  - deepseek_v31_w8a8c8_quarot

datasets:
  - random3

methods:
  # A2-supported smoke set. DFlash is intentionally omitted because the current
  # vLLM Ascend stack does not support method=dflash. Run model-free methods
  # before MTP so a failed MTP startup does not block ngram/suffix smoke data.
  - baseline
  - ngram
  - suffix
  - mtp
  - mtp_ngram_concat
  - mtp_suffix_concat

TP: 8
DP: 1
NPU_DEVICES: "0,1,2,3,4,5,6,7"

OUTPUT_DIR: results/a2_random3_smoke
PORT_BASE: 19000
READY_TIMEOUT_S: 3600
SERVER_CLEANUP_TIMEOUT_S: 30
POST_SERVER_CLEANUP_SLEEP_S: 20
STOP_ON_FAILURE: false
SKIP_COMPLETED: false
ASCEND_DEVICE_CHECK: warn

ENV:
  TASK_QUEUE_ENABLE: "1"
  HCCL_OP_EXPANSION_MODE: AIV
  VLLM_ASCEND_ENABLE_FLASHCOMM1: "0"

COMMON_SERVER_ARGS:
  trust_remote_code: true
  distributed_executor_backend: mp
  max_model_len: 4096
  max_num_batched_tokens: 32768
  gpu_memory_utilization: 0.9
  disable_uvicorn_access_log: true
  enforce_eager: true

COMMON_BENCH_ARGS:
  request_rate: inf
  max_concurrency: 1
  temperature: 0
  ignore_eos: true

model_catalog:
  glm_47_w8a8_floatmtp:
    path: /models/GLM-4.7-W8A8-floatmtp
    served_model_name: glm-4.7-w8a8-floatmtp
    tp: 8
    dp: 1
    npu_devices: "0,1,2,3,4,5,6,7"

  qwen35_397b_a17b_w4a8_mtp:
    path: /models/Qwen3.5-397B-A17B-w4a8-mtp
    served_model_name: qwen3.5-397b-a17b-w4a8-mtp
    tp: 8
    dp: 1
    npu_devices: "0,1,2,3,4,5,6,7"

  deepseek_v31_w8a8c8_quarot:
    path: /models/DeepSeek-V3.1-w8a8c8-QuaRot
    served_model_name: deepseek-v3.1-w8a8c8-quarot
    tp: 8
    dp: 1
    npu_devices: "0,1,2,3,4,5,6,7"
    # No native MTP marker in the model name; run model-free methods first.
    methods:
      - baseline
      - ngram
      - suffix

method_catalog:
  baseline: null

  mtp:
    method: mtp
    num_speculative_tokens: 1

  ngram:
    method: ngram
    num_speculative_tokens: 4
    prompt_lookup_min: 2
    prompt_lookup_max: 5

  suffix:
    method: suffix
    num_speculative_tokens: 4
    bench_passes:
      - cold
      - warm

  mtp_ngram_concat:
    method: mtp_ngram_concat
    num_speculative_tokens: 4
    hybrid_mtp_tokens: 1
    prompt_lookup_min: 2
    prompt_lookup_max: 5

  mtp_suffix_concat:
    method: mtp_suffix_concat
    num_speculative_tokens: 4
    hybrid_mtp_tokens: 1
    bench_passes:
      - cold
      - warm

dataset_catalog:
  random3:
    dataset_name: random
    num_prompts: 3
    random_input_len: 256
    random_output_len: 32
    random_range_ratio: 0.1

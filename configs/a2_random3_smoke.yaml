# A2 in-container random3 smoke-test configuration.
#
# This file is intentionally small: it only runs 3 random prompts and is meant
# to verify that model loading, model-free speculative methods, and cold/warm
# suffix passes can start successfully inside the current container.

models:
  - qwen3_235b_a22b_w8a8
  - deepseek_r1_distill_qwen_32b

datasets:
  - random3

methods:
  # A2-supported smoke set. DFlash is intentionally omitted because the current
  # vLLM Ascend stack does not support method=dflash. The selected models do
  # not look like native MTP checkpoints, so run model-free methods only.
  - baseline
  - ngram
  - suffix

TP: 8
DP: 1
NPU_DEVICES: "0,1,2,3,4,5,6,7"

OUTPUT_DIR: results/a2_random3_smoke
PORT_BASE: 19000
READY_TIMEOUT_S: 3600
SERVER_CLEANUP_TIMEOUT_S: 30
POST_SERVER_CLEANUP_SLEEP_S: 20
STOP_ON_FAILURE: false
SKIP_COMPLETED: false
ASCEND_DEVICE_CHECK: warn

ENV:
  TASK_QUEUE_ENABLE: "1"
  HCCL_OP_EXPANSION_MODE: AIV
  VLLM_ASCEND_ENABLE_FLASHCOMM1: "0"

COMMON_SERVER_ARGS:
  trust_remote_code: true
  distributed_executor_backend: mp
  max_model_len: 4096
  max_num_batched_tokens: 32768
  gpu_memory_utilization: 0.9
  disable_uvicorn_access_log: true
  enforce_eager: true

COMMON_BENCH_ARGS:
  request_rate: inf
  max_concurrency: 1
  temperature: 0
  ignore_eos: true

model_catalog:
  qwen3_235b_a22b_w8a8:
    path: /models/Qwen3-235B-A22B-W8A8
    served_model_name: qwen3-235b-a22b-w8a8
    tp: 8
    dp: 1
    npu_devices: "0,1,2,3,4,5,6,7"
    # No native MTP marker in the model name; run model-free methods first.
    methods:
      - baseline
      - ngram
      - suffix

  deepseek_r1_distill_qwen_32b:
    path: /models/DeepSeek-R1-Distill-Qwen-32B
    served_model_name: deepseek-r1-distill-qwen-32b
    tp: 8
    dp: 1
    npu_devices: "0,1,2,3,4,5,6,7"
    # This is a Qwen-distilled dense model, not a native DeepSeek MTP checkpoint.
    methods:
      - baseline
      - ngram
      - suffix

method_catalog:
  baseline: null

  mtp:
    method: mtp
    num_speculative_tokens: 4

  ngram:
    method: ngram
    num_speculative_tokens: 4
    prompt_lookup_min: 2
    prompt_lookup_max: 5

  suffix:
    method: suffix
    num_speculative_tokens: 4
    bench_passes:
      - cold
      - warm

  mtp_ngram_concat:
    method: mtp_ngram_concat
    num_speculative_tokens: 4
    hybrid_mtp_tokens: 1
    prompt_lookup_min: 2
    prompt_lookup_max: 5

  mtp_suffix_concat:
    method: mtp_suffix_concat
    num_speculative_tokens: 4
    hybrid_mtp_tokens: 1
    bench_passes:
      - cold
      - warm

dataset_catalog:
  random3:
    dataset_name: random
    num_prompts: 3
    random_input_len: 256
    random_output_len: 32
    random_range_ratio: 0.1
